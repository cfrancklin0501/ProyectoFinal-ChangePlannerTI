<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChangePlanner TI</title>
</head>
<main>
    //Datos de quien realiza el cambio y que area 
    <section id="registro">
      <h2>Registrar cambio</h2>
      <form id="form-cambio">
        <fieldset>
          <legend>Datos del solicitante</legend>
          <p><label for="fechaIngreso">Fecha de ingreso</label><br>
            <input type="date" id="fechaIngreso" name="fechaIngreso" required></p>
          <p><label for="codigoEmpleado">Código empleado</label><br>
            <input type="text" id="codigoEmpleado" name="codigoEmpleado"></p>
          <p><label for="usuario">Usuario</label><br>
            <input type="text" id="usuario" name="usuario" required></p>
          <p><label for="area">Área</label><br>
            <input type="text" id="area" name="area" required></p>
          <p><label for="idArea">ID área</label><br>
            <input type="text" id="idArea" name="idArea"></p>
        </fieldset>
</main>
